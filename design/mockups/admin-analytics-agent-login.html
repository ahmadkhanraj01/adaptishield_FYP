<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--
  AdaptiShield: Admin Console, Analytics, Demo Agent, Episode history and Login mockup (v2).
  Standalone file: open it directly in a browser, no build step.
  Analytics uses real committed results. Proposals, mail and episodes are samples.
  Documentation: design/README.md
-->
<title>AdaptiShield screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
html,body{height:100%} body{margin:0} [hidden]{display:none!important}
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#0E1726; --muted:#56647A; --line:#D5DCE7;
  --accent:#2446C8; --accent-soft:#E3E8FA;
  --ok:#0E8A5F; --ok-soft:#DCF2E8; --warn:#A96400; --warn-soft:#FBEACB; --bad:#C62F2C; --bad-soft:#F9DFDE; --skip:#9AA5B5;
  --s1:#9DB4F2; --s2:#5B7FE3; --s3:#2C3FBF; --on-primary:#fff;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(14,23,38,.06),0 4px 16px rgba(14,23,38,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#090E18; --surface:#111A29; --surface-2:#0D1421; --ink:#E4EAF3; --muted:#93A1B7; --line:#233047;
    --accent:#7F97FF; --accent-soft:#1A2448;
    --ok:#3CD398; --ok-soft:#0E2C22; --warn:#F2A83A; --warn-soft:#32230A; --bad:#FF6C66; --bad-soft:#3A1715; --skip:#56637A;
    --s1:#3C57C9; --s2:#6F8FF7; --s3:#B5C5FF; --on-primary:#0A1024;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#090E18; --surface:#111A29; --surface-2:#0D1421; --ink:#E4EAF3; --muted:#93A1B7; --line:#233047;
  --accent:#7F97FF; --accent-soft:#1A2448;
  --ok:#3CD398; --ok-soft:#0E2C22; --warn:#F2A83A; --warn-soft:#32230A; --bad:#FF6C66; --bad-soft:#3A1715; --skip:#56637A;
  --s1:#3C57C9; --s2:#6F8FF7; --s3:#B5C5FF; --on-primary:#0A1024;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;padding-inline:6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a,.nav button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--muted);font-weight:500}
.nav a:hover,.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav a:focus-visible,.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nav [aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav .num{font-family:var(--mono);font-size:11px;width:18px;height:18px;display:grid;place-items:center;border:1px solid currentColor;border-radius:5px;flex:none}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding-inline:6px;display:flex;flex-direction:column;gap:6px}
.conn{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.down{background:var(--bad)}
main{padding-block:22px 40px;padding-inline:28px;min-width:0;display:flex;flex-direction:column;gap:18px}
.view{display:flex;flex-direction:column;gap:18px;min-width:0}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.topbar h1{font-size:20px;font-weight:600;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.titles{display:flex;flex-direction:column;gap:2px;margin-right:auto;min-width:0}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input,textarea,.btn,.seg button{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 11px}
select{max-width:100%}
input,textarea{width:100%}
textarea{resize:vertical;min-height:64px}
.btn{cursor:pointer;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-primary)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.seg button:focus-visible,.row-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;cursor:pointer;padding:7px 11px;background:var(--surface);color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2{margin:0;font-family:var(--cond);font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card-b{padding:16px}
.meta{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.lbl{font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
.code{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--cond);font-weight:600;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.chip.ok{color:var(--ok)} .chip.warn{color:var(--warn)} .chip.bad{color:var(--bad)} .chip.muted{color:var(--muted)} .chip.route{color:var(--accent)}
.note{font-size:12.5px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:8px 12px}
.banner{border-radius:10px;padding:11px 13px;display:flex;gap:10px;align-items:flex-start;border:1px solid}
.banner .g{font-family:var(--mono);font-weight:500;flex:none}
.banner b{display:block;font-weight:600}
.banner span{color:var(--ink);font-size:13px}
.banner.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.banner.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.banner.info{background:var(--surface-2);border-color:var(--line);color:var(--muted)}
.empty{padding:32px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{color:var(--ink);font-weight:600}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.table-wrap{overflow-x:auto}
.small-n{font-family:var(--cond);font-size:11px;font-weight:600;color:var(--warn);margin-left:4px;white-space:nowrap}
/* admin */
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
.plist{list-style:none;margin:0;padding:6px}
.plist-t{padding:10px 12px 4px}
.row-btn{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:3px;width:100%;padding:9px 10px;border-radius:8px;cursor:pointer}
.row-btn:hover{background:var(--surface-2)}
.row-btn[aria-current="true"]{background:var(--accent-soft)}
.row-btn .r1{display:flex;gap:8px;justify-content:space-between;align-items:center}
.row-btn b{font-weight:600;font-size:13px;overflow-wrap:anywhere}
.row-btn small{color:var(--muted);font-size:12px}
.change{display:grid;grid-template-columns:auto auto auto auto;gap:6px 12px;align-items:center;justify-content:start;font-family:var(--mono);font-size:13px}
.evid{display:flex;flex-direction:column;gap:8px}
.evid-row{display:grid;grid-template-columns:128px minmax(0,1fr) 72px;gap:10px;align-items:center;font-size:13px}
.evid-track{height:14px;background:var(--surface-2);border-radius:0 4px 4px 0;overflow:hidden}
.evid-track i{display:block;height:100%;background:var(--s2);border-radius:0 4px 4px 0}
.evid-row.cur .evid-track i{background:var(--s1)}
.evid-row .v{font-family:var(--mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:16px}
.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.confirm{border:1.5px solid var(--accent);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--accent-soft)}
.confirm .row{display:flex;gap:8px;flex-wrap:wrap}
.tags{display:flex;flex-wrap:wrap;gap:6px}
/* analytics */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:13px 15px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .k{font-size:12.5px;color:var(--muted)}
.tile .v{font-size:26px;font-weight:600;line-height:1.2}
.tile .ci{font-family:var(--mono);font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.check{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.check input{width:auto;accent-color:var(--accent)}
.check[aria-disabled="true"]{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.sw.none{border:1px dashed var(--skip);background:none}
.chart{display:flex;flex-direction:column;gap:18px;margin-top:14px;position:relative}
.bar-group{display:grid;grid-template-columns:190px minmax(0,1fr);gap:12px;align-items:start}
.bar-title{font-size:13px;line-height:1.35;padding-top:1px}
.bar-title small{display:block;color:var(--muted);font-size:12px}
.bars{display:flex;flex-direction:column;gap:2px;position:relative}
.bar-line{display:block;position:relative;height:18px;border:0;padding:0;background:none;width:100%;text-align:left;font:inherit;color:inherit;cursor:default}
.bar-line:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.bar{position:absolute;left:0;top:1px;bottom:1px;border-radius:0 4px 4px 0;min-width:2px}
.whisk{position:absolute;top:8px;height:2px;background:var(--ink);opacity:.7;box-shadow:0 0 0 1px var(--surface)}
.whisk::before,.whisk::after{content:"";position:absolute;top:-3px;width:1.5px;height:8px;background:var(--ink)}
.whisk::before{left:0}.whisk::after{right:0}
.bar-val{position:absolute;top:0;font-family:var(--mono);font-size:11.5px;line-height:18px;white-space:nowrap;color:var(--ink);background:var(--surface);padding-inline:3px;border-radius:3px}
.axis{display:grid;grid-template-columns:190px minmax(0,1fr);gap:12px;margin-top:2px}
.ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:3px;font-variant-numeric:tabular-nums}
.tip{position:fixed;z-index:10;background:var(--ink);color:var(--surface);font-size:12px;padding:6px 9px;border-radius:7px;pointer-events:none;max-width:280px;line-height:1.4}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.stage-row{display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,1fr);gap:10px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line);align-items:center}
.stage-row:last-child{border-bottom:0}
.stage-row.head{font-family:var(--cond);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-top:0}
.mini-bar{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px}
.mini-bar .t{flex:1;height:10px;background:var(--surface-2);border-radius:0 3px 3px 0;overflow:hidden;max-width:110px}
.mini-bar i{display:block;height:100%;background:var(--s3);border-radius:0 3px 3px 0}
/* agent */
.agent{display:grid;grid-template-columns:240px minmax(0,1fr) 340px;gap:18px;align-items:start}
.mail{border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.mail.quarantine{border-style:dashed;border-color:var(--warn)}
.mail-h{padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);font-size:12.5px;display:flex;flex-direction:column;gap:1px}
.mail-h .from{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.mail-b{padding:12px;font-family:var(--mono);font-size:12.5px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.inj{background:var(--warn-soft);border-radius:2px}
.inj.cut{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--warn);color:var(--muted);background:none}
.inj.live{background:var(--bad-soft);color:var(--bad)}
.cut-tag{display:inline-block;margin-left:6px;font-family:var(--cond);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;background:var(--warn);color:var(--surface);padding:0 6px;border-radius:4px}
.chat{display:flex;flex-direction:column;gap:12px}
.say b{display:block;font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.say p{margin:0;overflow-wrap:anywhere}
.say.you p{background:var(--accent-soft);padding:9px 11px;border-radius:10px;font-weight:500}
.say.shield p{padding:9px 11px;border-radius:10px;border:1px solid}
.say.shield.warn p{background:var(--warn-soft);border-color:var(--warn)}
.say.shield.bad p{background:var(--bad-soft);border-color:var(--bad)}
.say.shield.ok p{background:var(--ok-soft);border-color:var(--ok)}
.say a{color:inherit;font-size:12.5px}
.strip{display:flex;gap:18px;flex-wrap:wrap;padding:11px 16px;font-size:13px;align-items:center}
.strip .bad{color:var(--bad);font-weight:600}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px}
.form{display:flex;flex-direction:column;gap:12px}
/* history */
.dots{display:flex;gap:3px}
.dots i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--line);display:block}
.dots i.ok{background:var(--ok);border-color:var(--ok)} .dots i.warn{background:var(--warn);border-color:var(--warn)} .dots i.bad{background:var(--bad);border-color:var(--bad)} .dots i.route{background:var(--accent);border-color:var(--accent)} .dots i.skip{border-style:dashed}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.preview-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:6px 10px}
.preview-bar select{font-size:12px;padding:3px 7px}
/* login */
.login-wrap{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.login{width:min(380px,100%);display:flex;flex-direction:column;gap:14px}
.login .card-b{display:flex;flex-direction:column;gap:14px;padding:22px}
.login h1{font-size:18px;font-weight:600;margin:0}
.login .foot{display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
/* responsive */
@media (max-width:1240px){.agent{grid-template-columns:220px minmax(0,1fr)}.agent>.assistant{grid-column:1/-1}}
@media (max-width:1100px){.grid2,.split{grid-template-columns:minmax(0,1fr)}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{border-right:0;border-bottom:1px solid var(--line);padding:12px 16px;gap:10px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px}
  .nav a,.nav button{white-space:nowrap}
  .side-foot{display:none}
  main{padding-inline:16px}
  .agent{grid-template-columns:minmax(0,1fr)}
  .bar-group,.axis{grid-template-columns:minmax(0,1fr);gap:4px}
  .axis>span:first-child{display:none}
  .evid-row{grid-template-columns:96px minmax(0,1fr) 62px}
  .stage-row{grid-template-columns:96px minmax(0,1fr) minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="login-screen" class="login-wrap" hidden></div>
<div class="app" id="app">
  <aside class="side">
    <div class="brand">
      <svg width="26" height="28" viewBox="0 0 26 28" aria-hidden="true"><path d="M13 1.5 24 5.5v8.2c0 6.3-4.6 10.8-11 12.8C6.6 24.5 2 20 2 13.7V5.5z" fill="var(--accent)"/><path d="M8 14.2l3.4 3.4L18.5 10" fill="none" stroke="var(--surface)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      AdaptiShield
    </div>
    <nav class="nav" aria-label="Modules" id="nav"></nav>
    <div class="side-foot">
      <label class="field">Preview as (mockup only)
        <select id="role"><option value="admin">Admin</option><option value="analyst">Analyst</option><option value="tester">Tester</option></select>
      </label>
      <div class="conn"><span class="dot" id="ws-dot"></span><span id="ws-text">ws /ws/episodes</span></div>
      <div class="conn"><span class="dot" id="model-dot"></span><span id="model-text">ollama connected</span></div>
      <button class="btn" id="sign-out">Sign out</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div class="tip" id="tip" hidden role="status"></div>

<script>
"use strict";
/* Builds DOM with text nodes only, so sample "attacker" text can never run as HTML (Rules.md section 5). */
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "style") e.style.cssText = v;
    else if (k === "value") e.value = v;
    else if (k === "checked" || k === "disabled") e[k] = !!v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return e;
}
const card = (title, meta, ...body) => h("div", {class:"card"},
  h("div", {class:"card-h"}, h("h2", null, title), meta ? h("span", {class:"meta"}, meta) : null),
  h("div", {class:"card-b"}, body));
const banner = (kind, glyph, title, text) => h("div", {class:"banner " + kind, role: kind === "bad" ? "alert" : null},
  h("span", {class:"g", "aria-hidden":"true"}, glyph), h("div", null, h("b", null, title), text ? h("span", null, text) : null));
const empty = (title, text, action) => h("div", {class:"empty"}, h("b", null, title), h("span", null, text), action);
const stateBar = (id, options) => h("div", {class:"preview-bar"}, h("label", {for:id}, "Preview state (mockup only)"),
  h("select", {id, onchange: e => { state[id] = e.target.value; render(); }},
    Object.entries(options).map(([v, t]) => h("option", {value:v, selected: state[id] === v ? "selected" : null}, t))));

const VIEWS = {
  monitor:  {num:"4", label:"Live Monitor", href:"live-monitor-attack-lab.html"},

      h("ul", {class:"plist"}, Object.entries(MAILS).map(([id, x]) => h("li", null,
        h("button", {class:"row-btn", "aria-current":String(state.mail === id), onclick:() => { state.mail = id; state.planting = false; render(); }},
          h("b", null, x.from), h("small", null, x.subj))))),
      h("div", {style:"padding:0 12px 12px"}, h("button", {class:"btn", style:"width:100%", onclick:() => { state.planting = !state.planting; render(); }}, "Plant attack"))),
    h("div", {class:"stack"},
      card("Email", "tool content, untrusted",
        h("div", {class:"mail quarantine"}, h("div", {class:"mail-h"}, h("b", null, m.subj), h("span", {class:"from"}, m.addr)), body)),
      state.planting ? plantForm() : null),
    h("div", {class:"card assistant"}, h("div", {class:"card-h"}, h("h2", null, "Assistant"), h("span", {class:"meta"}, "read_email")),
      h("div", {class:"card-b chat"}, conversation(m)))));
  out.push(h("div", {class:"card"}, h("div", {class:"strip"},
    h("span", {class:"lbl", style:"margin:0"}, "Simulated tools"),
    h("span", {class:forwarded ? "bad" : null}, "Sent ", forwarded ? "1 email" : "0 emails"),
    h("span", null, "Deleted 0 files"), h("span", null, "Uploaded 0 files"),
    h("span", {class:"sub"}, "These tools only log what would have happened."))));
  return out;
}
function plantForm(){
  const text = h("textarea", {id:"plant-text"}, INJECTION);
  return card("Plant attack", "shown as plain text only", h("div", {class:"form"},
    h("label", {class:"field"}, "Where it goes", h("select", null, ["End of the email","Start of the email","Middle of the email"].map(t => h("option", null, t)))),
    h("label", {class:"field"}, "Injected text", text),
    h("div", {class:"actions"},
      h("button", {class:"btn", onclick:() => { state.planting = false; render(); }}, "Cancel"),
      h("button", {class:"btn primary", onclick:() => { state.planted = {mail:state.mail, text:" " + text.value}; state.planting = false; render(); }}, "Plant in this email"))));
}

/* ------------------------------- Episode history ------------------------------- */
const PATHS = {
  safe_continuation:["ok","ok","warn","route","bad","warn","ok","ok","warn"],
  blocked:["ok","ok","warn","bad","skip","skip","skip","skip","bad"],
  approved_direct:["ok","ok","ok","ok","skip","skip","ok","ok","ok"],
  approved_causal:["ok","ok","ok","route","ok","skip","ok","ok","ok"],
};
const FINAL = {safe_continuation:["warn","✂︎","Injection removed"], blocked:["bad","✕","Blocked"], approved_direct:["ok","✓","Approved directly"], approved_causal:["ok","✓","Approved after check"]};
const EPISODES = [
  [142,"09:14:22","Summarize the latest email from Sara.","Demo agent","Sample injection","safe_continuation"],
  [141,"09:11:03","Check the latest build log and tell me if it passed.","Attack Lab","Sample injection","blocked"],
  [140,"09:06:47","Summarize the latest email from IT.","Demo agent","Clean","approved_direct"],
  [139,"08:58:12","Forward the signed contract email to bilal@northwind.co.","Demo agent","Clean","approved_causal"],
];
function renderHistory(){
  const out = [topbar("Episode history", "Open a past request in the Live Monitor to replay every stage.")];
  out.push(stateBar("st-history", {normal:"Episodes stored", none:"No episodes yet", disconnected:"Live updates paused"}));
  if (state["st-history"] === "disconnected") out.push(banner("warn", "!", "Live updates paused. Reconnecting.", "New episodes will appear when the connection returns. Stored episodes still open normally."));
  if (state["st-history"] === "none") { out.push(h("div", {class:"card"}, empty("No episodes yet", "Run the Demo Agent or an attack, and each request will appear here."))); return out; }
  out.push(h("div", {class:"filters"},
    [["Status",["All statuses",...Object.values(FINAL).map(f => f[2])]],["Source",["All sources","Demo agent","Attack Lab","Batch"]],["Type",["All types","Clean","Data Security Harm","Financial Harm","Physical Harm"]]].map(([n, opts]) =>
      h("label", {class:"check"}, n, h("select", null, opts.map(o => h("option", null, o)))))));
  out.push(h("div", {class:"card"}, h("div", {class:"table-wrap"}, h("table", null,
    h("thead", null, h("tr", null, ["#","Time","Request","Source","Attack type","Path","Status"].map(t => h("th", null, t)))),
    h("tbody", null, EPISODES.map(e => h("tr", null,
      h("td", {class:"num"}, h("a", {href:"live-monitor-attack-lab.html", style:"color:inherit"}, e[0])), h("td", {class:"num"}, e[1]), h("td", null, e[2]), h("td", null, e[3]), h("td", null, e[4]),
      h("td", null, h("span", {class:"dots", role:"img", "aria-label":"Stage path: " + PATHS[e[5]].join(", ")}, PATHS[e[5]].map(c => h("i", {class:c})))),
      h("td", null, h("span", {class:"chip " + FINAL[e[5]][0]}, FINAL[e[5]][1] + " " + FINAL[e[5]][2])))))))));
  out.push(sourceNote("Sample episodes. The real list comes from GET /api/episodes."));
  return out;
}

/* ------------------------------- Login ------------------------------- */
function renderLogin(){
  const root = document.getElementById("login-screen");
  const s = state["st-login"];
  const email = h("input", {id:"email", type:"email", autocomplete:"username", value:"admin@northwind.co"});
  const pw = h("input", {id:"password", type:"password", autocomplete:"current-password"});
  const form = h("form", {class:"form", onsubmit:e => {
    e.preventDefault();
    if (state["st-login"] !== "normal") return;
    state.signedIn = true; state.view = HOME[state.role]; render();
  }},
    h("div", {class:"field"}, h("label", {for:"email"}, "Email"), email),
    h("div", {class:"field"}, h("label", {for:"password"}, "Password"), pw),
    s === "wrong" ? banner("bad", "!", "Email or password is incorrect.") : null,
    s === "down" ? banner("bad", "!", "The backend is not responding.", "Run docker compose up, then try again.") : null,
    h("button", {class:"btn primary", type:"submit", disabled:s === "down"}, "Sign in"));
  root.replaceChildren(h("div", {class:"login"},
    h("div", {class:"card"}, h("div", {class:"card-b"},
      h("div", {class:"brand", style:"padding:0"}, document.querySelector(".brand svg").cloneNode(true), "AdaptiShield"),
      h("h1", null, "Sign in to AdaptiShield"), form)),
    h("div", {class:"foot"},
      h("span", {class:"conn"}, h("span", {class:"dot" + (s === "down" ? " down" : "")}), "backend"),
      h("span", {class:"conn"}, h("span", {class:"dot" + (s === "down" ? " down" : "")}), "local models")),
    stateBar("st-login", {normal:"Normal", wrong:"Wrong password", down:"Backend down"})));
}

/* ------------------------------- Frame ------------------------------- */
function topbar(title, sub, ...controls){
  return h("div", {class:"topbar"}, h("div", {class:"titles"}, h("h1", null, title), h("div", {class:"sub"}, sub)),
    controls.length ? h("div", {class:"controls"}, controls) : null);
}
function renderNav(){
  const nav = document.getElementById("nav");
  nav.replaceChildren(...Object.entries(VIEWS).filter(([, v]) => !v.roles || v.roles.includes(state.role)).map(([k, v]) => {
    const inner = [h("span", {class:"num"}, v.num), v.label];
    return v.href ? h("a", {href:v.href}, inner)
      : h("button", {"aria-current": state.view === k ? "page" : null, onclick:() => { state.view = k; history.replaceState(null, "", "#" + k); render(); }}, inner);
  }));
}
function render(){
  const app = document.getElementById("app"), login = document.getElementById("login-screen");
  app.hidden = !state.signedIn; login.hidden = state.signedIn;
  if (!state.signedIn) { renderLogin(); document.title = "Sign in to AdaptiShield"; return; }
  renderNav();
  const pages = {admin:renderAdmin, analytics:renderAnalytics, agent:renderAgent, history:renderHistory};
  const out = pages[state.view]();
  document.getElementById("main").replaceChildren(h("section", {class:"view", "aria-label":VIEWS[state.view].label}, out));
  document.title = VIEWS[state.view].label + ", AdaptiShield";
  const down = state["st-agent"] === "down";
  document.getElementById("model-dot").className = "dot" + (down ? " down" : "");
  document.getElementById("model-text").textContent = down ? "ollama not responding" : "ollama connected";
  const wsDown = state["st-history"] === "disconnected";
  document.getElementById("ws-dot").className = "dot" + (wsDown ? " down" : "");
  document.getElementById("ws-text").textContent = wsDown ? "ws reconnecting" : "ws /ws/episodes";
}
document.getElementById("role").addEventListener("change", e => {
  state.role = e.target.value; state.view = HOME[state.role]; render();
});
document.getElementById("sign-out").addEventListener("click", () => {
  state.signedIn = false; history.replaceState(null, "", "#login"); render();
});
/* One tooltip for every chart bar, on hover and on keyboard focus. */
const tip = document.getElementById("tip");
function showTip(el, x, y){ tip.textContent = el.dataset.tip; tip.hidden = false; tip.style.left = Math.min(x + 12, innerWidth - 290) + "px"; tip.style.top = (y + 14) + "px"; }
document.addEventListener("mousemove", e => { const b = e.target.closest && e.target.closest("[data-tip]"); if (b) showTip(b, e.clientX, e.clientY); else if (document.activeElement && !document.activeElement.dataset?.tip) tip.hidden = true; else if (!b) tip.hidden = true; });
document.addEventListener("focusin", e => { if (e.target.dataset && e.target.dataset.tip) { const r = e.target.getBoundingClientRect(); showTip(e.target, r.left, r.top + 8); } });
document.addEventListener("focusout", () => { tip.hidden = true; });
/* Deep links, so each screen can be opened and screenshotted directly. */
const start = location.hash.slice(1);
if (start === "login") state.signedIn = false;
else if (pagesKnown(start)) state.view = start;
function pagesKnown(k){ return ["admin","analytics","agent","history"].includes(k); }
render();
</script>
