# GENERATED by site_src/build.py — edit the template there, not this file.
site_name: AdaptiShield
site_description: Causal prompt-injection detection depends on a liftable target
site_url: https://ahmadkhanraj01.github.io/adaptishield/
repo_url: https://github.com/ahmadkhanraj01/adaptishield
repo_name: ahmadkhanraj01/adaptishield
docs_dir: site_src/docs
site_dir: site
theme:
  name: material
  features: [navigation.tabs, navigation.sections, navigation.top, search.suggest, content.code.copy, toc.follow]
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle: {icon: material/brightness-7, name: Dark}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle: {icon: material/brightness-4, name: Light}
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc: {permalink: true}
nav:
  - Home: index.md
  - Architecture: architecture.md
  - Manuscript: manuscript/index.md
  - Write-up:
    - "How to use": writeup/README.md
    - "Abstract": writeup/00-abstract.md
    - "Introduction": writeup/01-introduction.md
    - "Related work": writeup/02-related-work.md
    - "Methodology": writeup/03-methodology.md
    - "Experiments and results": writeup/04-experiments-results.md
    - "Discussion": writeup/05-discussion.md
    - "Conclusion": writeup/06-conclusion.md
    - "Rules: research paper": writeup/rules/general-research-paper-rules.md
    - "Rules: journal paper": writeup/rules/journal-paper-rules.md
  - Progress: progress.md
