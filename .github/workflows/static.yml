# Builds the project website with MkDocs and publishes only the built pages.
name: Deploy website to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Run one deployment at a time, and let a running deployment finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install MkDocs
        run: pip install "mkdocs<2" mkdocs-material
      - name: Build the website
        run: mkdocs build --strict
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload the built website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
